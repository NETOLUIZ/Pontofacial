# ==============================================================================
# CONFIGURAÇÃO NGINX HOST VPS - PTFACIAL.KORENTECH.COM.BR & SUBDOMÍNIOS
# Local no servidor: /etc/nginx/sites-available/ptfacial
# ==============================================================================

server {
    listen 80;
    server_name ptfacial.korentech.com.br *.ptfacial.korentech.com.br;

    # Encaminhamento transparente para o container Docker (porta 3080)
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 15M;
    }
}
